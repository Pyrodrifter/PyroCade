name: Release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y build-essential curl file libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf rpm librsvg2-dev wget xvfb
      - run: npm ci
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test migrated Rust behavior
        run: npm run tauri:test
      - name: Check Rust targets
        run: cargo check --manifest-path src-tauri/Cargo.toml

  macos-arm64:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: macos-14
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = arm64
      - name: Build macOS ARM64 release
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBLIC_KEY" ]; then
            TAURI_CONFIG="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "bundle": {"createUpdaterArtifacts": True},
              "plugins": {"updater": {
                  "pubkey": os.environ["TAURI_UPDATER_PUBLIC_KEY"],
                  "endpoints": [f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/latest.json"],
              }},
          }))
          PY
          )"
            export TAURI_CONFIG
          fi
          npm run dist:macos:arm64
      - name: Install and smoke-test macOS ARM64 artifact
        env:
          APP_SMOKE_STARTUP_SECONDS: 10
        run: |
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          mountpoint="$RUNNER_TEMP/pyrocade-dmg"
          installed_app="$RUNNER_TEMP/Applications/PyroCade.app"
          mkdir -p "$mountpoint" "$(dirname "$installed_app")"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          app=$(find "$mountpoint" -maxdepth 2 -name '*.app' -print -quit)
          test -n "$app"
          ditto "$app" "$installed_app"
          hdiutil detach "$mountpoint"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$installed_app/Contents/Info.plist")
          "$installed_app/Contents/MacOS/$executable" >"$RUNNER_TEMP/pyrocade-smoke.log" 2>&1 &
          app_pid=$!
          sleep "$APP_SMOKE_STARTUP_SECONDS"
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/pyrocade-smoke.log"
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true
      - uses: actions/upload-artifact@v4
        with:
          name: pyrocade-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  linux-arm64:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-24.04-arm
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: cargo install tauri-driver --locked
      - run: sudo apt-get update && sudo apt-get install -y build-essential curl file libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev webkit2gtk-driver libxdo-dev patchelf rpm librsvg2-dev wget
      - run: npm ci
      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Build Linux ARM64 release
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBLIC_KEY" ]; then
            TAURI_CONFIG="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "bundle": {"createUpdaterArtifacts": True},
              "plugins": {"updater": {
                  "pubkey": os.environ["TAURI_UPDATER_PUBLIC_KEY"],
                  "endpoints": [f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/latest.json"],
              }},
          }))
          PY
          )"
            export TAURI_CONFIG
          fi
          npm run dist:linux:arm64
      - name: Install and smoke-test Linux ARM64 package
        env:
          HOME: ${{ runner.temp }}/pyrocade-home
        run: |
          mkdir -p "$HOME"
          sudo apt-get install -y xvfb
          package=$(find src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb --field "$package" Architecture)" = arm64
          sudo apt-get install -y "$package"
          package_name=$(dpkg-deb --field "$package" Package)
          executable=$(dpkg -L "$package_name" | awk '/^\/usr\/bin\// { print; exit }')
          test -n "$executable"
          TAURI_APP_BINARY="$executable" xvfb-run -a npm run tauri:webview:check
      - uses: actions/upload-artifact@v4
        with:
          name: pyrocade-linux-arm64
          path: |
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          if-no-files-found: error

  android-arm64:
    needs: validate
    runs-on: ubuntu-24.04
    env:
      NODE_VERSION: '22'
      JAVA_VERSION: '17'
      ANDROID_COMPILE_API_LEVEL: '36'
      ANDROID_TARGET_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
      ANDROID_NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK components
        run: sdkmanager --install "platforms;android-${ANDROID_COMPILE_API_LEVEL}" "platforms;android-${ANDROID_TARGET_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" "ndk;${ANDROID_NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci
      - name: Generate Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build Android ARM64 APK
        run: npm run dist:android:arm64
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: pyrocade-android-arm64-unsigned-ci
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    needs: [validate, macos-arm64, linux-arm64, android-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Generate signed updater manifest
        env:
          GH_REPO: ${{ github.repository }}
          GH_TAG: ${{ env.TAG }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          from urllib.parse import quote

          platforms = {}
          for signature_path in Path("out").rglob("*.sig"):
              filename = signature_path.name[:-4]
              if filename.endswith(".app.tar.gz"):
                  target = "darwin-aarch64"
              elif filename.endswith(".AppImage"):
                  target = "linux-aarch64"
              else:
                  continue
              artifact = signature_path.with_name(filename)
              if not artifact.is_file():
                  continue
              platforms[target] = {
                  "signature": signature_path.read_text().strip(),
                  "url": f"https://github.com/{os.environ['GH_REPO']}/releases/download/{quote(os.environ['GH_TAG'])}/{quote(filename)}",
              }

          if platforms:
              manifest = {
                  "version": os.environ["GH_TAG"].lstrip("vV"),
                  "pub_date": datetime.now(timezone.utc).isoformat(),
                  "platforms": platforms,
              }
              Path("out/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
              print(f"Generated signed updater manifest for: {', '.join(sorted(platforms))}")
          else:
              print("No signed updater artifacts; releases will use manual update links.")
          PY
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find out -type f -print0)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --title "PyroCade ${TAG#v}" --generate-notes
          fi
