name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  macos-arm64:
    runs-on: macos-14
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Build macOS ARM64 release
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBLIC_KEY" ]; then
            TAURI_CONFIG="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "bundle": {"createUpdaterArtifacts": True},
              "plugins": {"updater": {
                  "pubkey": os.environ["TAURI_UPDATER_PUBLIC_KEY"],
                  "endpoints": [f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/latest.json"],
              }},
          }))
          PY
          )"
            export TAURI_CONFIG
          fi
          npm run dist:macos:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: pyrocade-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y build-essential curl file libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf rpm librsvg2-dev wget
      - run: npm ci
      - name: Build Linux ARM64 release
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBLIC_KEY" ]; then
            TAURI_CONFIG="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "bundle": {"createUpdaterArtifacts": True},
              "plugins": {"updater": {
                  "pubkey": os.environ["TAURI_UPDATER_PUBLIC_KEY"],
                  "endpoints": [f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/latest.json"],
              }},
          }))
          PY
          )"
            export TAURI_CONFIG
          fi
          npm run dist:linux:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: pyrocade-linux-arm64
          path: |
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    needs: [macos-arm64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Generate signed updater manifest
        env:
          GH_REPO: ${{ github.repository }}
          GH_TAG: ${{ env.TAG }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          from urllib.parse import quote

          platforms = {}
          for signature_path in Path("out").rglob("*.sig"):
              filename = signature_path.name[:-4]
              if filename.endswith(".app.tar.gz"):
                  target = "darwin-aarch64"
              elif filename.endswith(".AppImage"):
                  target = "linux-aarch64"
              else:
                  continue
              artifact = signature_path.with_name(filename)
              if not artifact.is_file():
                  continue
              platforms[target] = {
                  "signature": signature_path.read_text().strip(),
                  "url": f"https://github.com/{os.environ['GH_REPO']}/releases/download/{quote(os.environ['GH_TAG'])}/{quote(filename)}",
              }

          if platforms:
              manifest = {
                  "version": os.environ["GH_TAG"].lstrip("vV"),
                  "pub_date": datetime.now(timezone.utc).isoformat(),
                  "platforms": platforms,
              }
              Path("out/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
              print(f"Generated signed updater manifest for: {', '.join(sorted(platforms))}")
          else:
              print("No signed updater artifacts; releases will use manual update links.")
          PY
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find out -type f -print0)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --title "PyroCade ${TAG#v}" --generate-notes
          fi
