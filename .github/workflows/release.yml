# Builds the Windows installer, the Linux packages and the Mac disk images, smoke-tests Linux and Mac, and attaches
# everything to a *draft* GitHub release. Publish the draft when it looks right; installed
# copies of PyroCade only see published releases.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.2.0)'
        required: true
      use_electron_mirror:
        description: 'Use alternate Electron and packaging tool downloads'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  ELECTRON_MIRROR: ${{ inputs.use_electron_mirror && 'https://npmmirror.com/mirrors/electron/' || '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/checkout@v7
        with:
          repository: bo3b/SR-lib
          ref: 39de32110ca05842cd0a7b48560e9194c28ef7cb
          path: native/SR-lib
          persist-credentials: false
      - name: Build Leia SR presenter
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build native/build --config Release
      - run: npm ci
      - &seed_builder_tools
        name: Fetch packaging tools through the GitHub API
        if: ${{ inputs.use_electron_mirror }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # electron-builder validates the cached archives against its pinned checksums.
          cache="$RUNNER_TEMP/electron-builder-cache"
          fetch_tool() {
            mkdir -p "$cache/$1"
            gh api -H 'Accept: application/octet-stream' \
              "repos/electron-userland/electron-builder-binaries/releases/assets/$3" > "$cache/$1/$2"
          }
          case "$RUNNER_OS" in
            Windows)
              fetch_tool '7zip@1.0.0' 7zip-win-x64.tar.gz 437402797
              fetch_tool winCodeSign-2.6.0 winCodeSign-2.6.0.7z 18435274
              fetch_tool nsis-3.0.4.1 nsis-3.0.4.1.7z 16428442
              fetch_tool nsis-resources-3.4.1 nsis-resources-3.4.1.7z 13752602
              ;;
            Linux)
              fetch_tool '7zip@1.0.0' 7zip-linux-x64.tar.gz 437402746
              fetch_tool appimage-12.0.1 appimage-12.0.1.7z 13613639
              fetch_tool 'fpm@2.1.4' fpm-1.17.0-ruby-3.4.3-linux-amd64.7z 319525808
              ;;
            macOS)
              fetch_tool 'icons@1.2.3' icons-bundle.tar.gz 459442159
              if [[ "$RUNNER_ARCH" == ARM64 ]]; then
                fetch_tool '7zip@1.0.0' 7zip-darwin-arm64.tar.gz 437402642
                fetch_tool 'dmg-builder@1.2.5' dmgbuild-bundle-arm64-75c8a6c.tar.gz 436378817
              else
                fetch_tool '7zip@1.0.0' 7zip-darwin-x86_64.tar.gz 437402689
                fetch_tool 'dmg-builder@1.2.5' dmgbuild-bundle-x86_64-75c8a6c.tar.gz 436378863
              fi
              ;;
          esac
          echo "ELECTRON_BUILDER_CACHE=$cache" >> "$GITHUB_ENV"
      - run: npx electron-builder --win nsis --publish never
      - name: Verify the packaged Leia SR presenter
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath 'dist/win-unpacked/resources/leia/PyroCadeLeia.exe' -PathType Leaf)) {
            throw 'The Windows package is missing the Leia SR presenter'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/PyroCade-Setup-*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      # rpm builds the Fedora package, libarchive-tools the Arch one; xvfb runs the smoke test.
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xvfb
      - run: npm ci
      - *seed_builder_tools
      - run: npx electron-builder --linux AppImage deb rpm pacman --publish never
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          PYROCADE_SNAP: ${{ runner.temp }}/appimage.png
          PYROCADE_JS: (async()=>JSON.stringify({version:await api.appVersion(),emulators:(await api.emuList()).filter(e=>e.managed).length,demo:!document.getElementById('demoBanner').classList.contains('hidden')}))()
        run: |
          chmod +x dist/PyroCade-*.AppImage
          timeout 120 xvfb-run -a dist/PyroCade-*.AppImage --no-sandbox
          cat "$PYROCADE_SNAP.txt"; echo
          test -s "$PYROCADE_SNAP"
          grep -q '"emulators":11' "$PYROCADE_SNAP.txt"
      - name: Smoke test the .deb
        env:
          PYROCADE_SNAP: ${{ runner.temp }}/deb.png
        run: |
          sudo apt-get install -y ./dist/pyrocade_*_amd64.deb
          timeout 120 xvfb-run -a pyrocade --no-sandbox
          test -s "$PYROCADE_SNAP"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/PyroCade-*.AppImage
            dist/pyrocade_*.deb
            dist/pyrocade-*.rpm
            dist/pyrocade-*.pkg.tar.zst
            ${{ runner.temp }}/*.png
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    env:
      # Ad-hoc signed (no Apple developer certificate yet): skip looking for one.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - *seed_builder_tools
      - run: npx electron-builder --mac --publish never
      - name: Check the signature
        run: codesign --verify --deep --verbose=2 dist/mac-arm64/PyroCade.app
      - name: Smoke test the app
        env:
          PYROCADE_SNAP: ${{ runner.temp }}/mac.png
          PYROCADE_JS: (async()=>JSON.stringify({version:await api.appVersion(),demo:!document.getElementById('demoBanner').classList.contains('hidden')}))()
        run: |
          perl -e 'alarm 120; exec @ARGV' dist/mac-arm64/PyroCade.app/Contents/MacOS/PyroCade
          cat "$PYROCADE_SNAP.txt"; echo
          test -s "$PYROCADE_SNAP"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            dist/PyroCade-*.dmg
            dist/PyroCade-*-mac-*.zip
            ${{ runner.temp }}/mac.png
          if-no-files-found: error

  release:
    needs: [windows, linux, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: out }
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=$(find out -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.dmg' -o -name '*-mac-*.zip' \))
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --draft --title "PyroCade ${TAG#v}" --generate-notes
          fi
